name: 'truecopy — gate your agent skills'
description: 'Gate agent skills & MCP servers in CI: fail on drift or poisoning, or poison-scan a manifest or marketplace.'
author: 'Thomas Sprayberry (askalf)'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  command:
    description: >-
      What to run. 'verify' re-checks every skill pinned in truecopy.lock for
      drift, poisoning, and publisher trust (the CI gate). 'scan' poison-scans
      sources without needing a lock.
    required: false
    default: 'verify'
  path:
    description: >-
      For 'scan': source(s) to scan — an MCP manifest (.json), a skill
      directory, or a file. One path per line for multiple sources.
    required: false
    default: ''
  marketplace:
    description: >-
      For 'scan': path to a CLONED marketplace or plugin repo to audit. truecopy
      stays offline by design — your workflow checks out the ref you are
      vetting, truecopy scans it.
    required: false
    default: ''
  lock:
    description: >-
      Path to the lockfile (for 'verify'). Leave empty to let truecopy resolve it:
      it prefers truecopy.lock and transparently falls back to an existing
      canon.lock (pre-rename repos), so a repo pinned before the rename keeps
      verifying with zero changes. Set this only to point at a non-default path.
    required: false
    default: ''
  trust:
    description: >-
      Path to a truecopy.trust file for publisher-signature verification
      (optional; a repo-committed truecopy.trust is picked up by truecopy itself).
    required: false
    default: ''
  working-directory:
    description: 'Directory to run truecopy in.'
    required: false
    default: '.'
  truecopy-ref:
    description: >-
      Git ref of askalf/truecopy to install — tag, branch, or commit SHA. This is
      a supply-chain gate: pin a tag or SHA, do not float a branch. A release tag
      of v0.9.0 or later installs from the signed release tarball; anything else
      falls back to a git install, which npm v12 blocks by default.
    required: false
    default: 'v0.10.0'
  verify-attestation:
    description: >-
      Verify the release tarball's Sigstore attestation (`gh attestation verify
      --owner askalf`) before installing. Only applies to the tarball path — a
      git-installed ref has nothing to attest. Needs the gh CLI and a token.
    required: false
    default: 'false'

outputs:
  report:
    description: "truecopy's text output (truncated to 64 KiB)."
    value: ${{ steps.run.outputs.report }}

runs:
  using: 'composite'
  steps:
    - name: Install truecopy
      shell: bash
      env:
        TRUECOPY_REF: ${{ inputs.truecopy-ref }}
        TRUECOPY_ATTEST: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail

        if ! command -v node >/dev/null 2>&1; then
          echo "::error::node not found on this runner — add an actions/setup-node step (node-version >= 20) before this action"
          exit 1
        fi
        major="$(node -p 'process.versions.node.split(".")[0]')"
        if [ "$major" -lt 20 ]; then
          echo "::error::truecopy needs node >= 20, runner has $(node --version) — add an actions/setup-node step with node-version: 20"
          exit 1
        fi

        npm_major="$(npm -v | cut -d. -f1)"

        # Prefer the signed release tarball. npm v12 blocks git dependencies by
        # default, and a supply-chain gate should not install itself over the
        # route npm hardened against. Only release-shaped refs have a tarball —
        # a branch or a bare SHA does not, and neither do releases before
        # v0.9.0, which shipped no assets.
        ver=''
        case "$TRUECOPY_REF" in
          v[0-9]*.[0-9]*.[0-9]*) ver="${TRUECOPY_REF#v}" ;;
          [0-9]*.[0-9]*.[0-9]*)  ver="$TRUECOPY_REF" ;;
        esac

        installed=0
        if [ -n "$ver" ]; then
          tgz="askalf-truecopy-${ver}.tgz"
          url="https://github.com/askalf/truecopy/releases/download/v${ver}/${tgz}"
          tmp="$(mktemp -d)"
          if curl -fsSL --retry 3 --retry-delay 2 -o "${tmp}/${tgz}" "$url" 2>/dev/null; then
            if [ "$TRUECOPY_ATTEST" = 'true' ]; then
              if ! command -v gh >/dev/null 2>&1; then
                echo "::error::verify-attestation: the gh CLI is not on this runner"
                exit 1
              fi
              echo "Verifying Sigstore attestation for ${tgz}…"
              if ! gh attestation verify "${tmp}/${tgz}" --owner askalf; then
                echo "::error::attestation verification FAILED for ${tgz} — refusing to install"
                exit 1
              fi
            fi
            if npm install -g --no-fund --no-audit "${tmp}/${tgz}"; then
              installed=1
              echo "truecopy ${ver} installed from the signed release tarball"
            else
              echo "::error::failed to install ${tgz}"
              exit 1
            fi
          else
            echo "::notice::no release tarball for v${ver} (assets start at v0.9.0) — falling back to a git install"
          fi
        fi

        if [ "$installed" -eq 0 ]; then
          if [ "$npm_major" -ge 12 ]; then
            echo "::warning::npm ${npm_major} blocks git dependencies by default; retrying with --allow-git. Pin truecopy-ref to a release tag >= v0.9.0 to install from the signed tarball instead."
            if ! npm install -g --allow-git --no-fund --no-audit "github:askalf/truecopy#${TRUECOPY_REF}"; then
              echo "::error::git install of '${TRUECOPY_REF}' failed under npm ${npm_major}, which blocks git dependencies. Set truecopy-ref to a release tag >= v0.9.0 (e.g. v0.10.0) so the action installs from the signed release tarball."
              exit 1
            fi
          else
            if ! npm install -g --no-fund --no-audit "github:askalf/truecopy#${TRUECOPY_REF}"; then
              echo "::error::git install of '${TRUECOPY_REF}' failed"
              exit 1
            fi
          fi
        fi

    - name: Run truecopy
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TRUECOPY_CMD: ${{ inputs.command }}
        TRUECOPY_PATHS: ${{ inputs.path }}
        TRUECOPY_MARKETPLACE: ${{ inputs.marketplace }}
        TRUECOPY_LOCK: ${{ inputs.lock }}
        TRUECOPY_TRUST: ${{ inputs.trust }}
      run: |
        args=()
        case "$TRUECOPY_CMD" in
          verify)
            args=(verify)
            if [ -n "$TRUECOPY_LOCK" ]; then args+=(--lock "$TRUECOPY_LOCK"); fi
            if [ -n "$TRUECOPY_TRUST" ]; then args+=(--trust "$TRUECOPY_TRUST"); fi
            ;;
          scan)
            if [ -z "$TRUECOPY_PATHS" ] && [ -z "$TRUECOPY_MARKETPLACE" ]; then
              echo "::error::command 'scan' needs 'path' and/or 'marketplace'"
              exit 2
            fi
            args=(scan)
            while IFS= read -r p; do
              if [ -n "$p" ]; then args+=("$p"); fi
            done <<< "$TRUECOPY_PATHS"
            if [ -n "$TRUECOPY_MARKETPLACE" ]; then args+=(--marketplace "$TRUECOPY_MARKETPLACE"); fi
            ;;
          *)
            echo "::error::unknown command '$TRUECOPY_CMD' — use 'verify' or 'scan'"
            exit 2
            ;;
        esac

        report="$RUNNER_TEMP/truecopy-report.txt"
        status=0
        truecopy "${args[@]}" 2>&1 | tee "$report" || status=$?

        {
          echo 'report<<TRUECOPY_REPORT_EOF'
          head -c 65536 "$report"
          echo ''
          echo 'TRUECOPY_REPORT_EOF'
        } >> "$GITHUB_OUTPUT"

        {
          if [ "$status" -eq 0 ]; then
            echo "### truecopy $TRUECOPY_CMD — clean ✅"
          else
            echo "### truecopy $TRUECOPY_CMD — FAILED ⛔ (exit $status)"
          fi
          echo ''
          echo '```text'
          head -c 262144 "$report"
          if [ "$(wc -c < "$report")" -gt 262144 ]; then echo '… (truncated)'; fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        rm -f "$report"
        exit "$status"
