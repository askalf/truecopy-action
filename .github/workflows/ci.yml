name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-clean:
    name: verify — clean lock passes
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin the fixture
        run: npx -y github:askalf/truecopy#v0.8.0 add fixtures/clean-mcp.json --lock "$RUNNER_TEMP/truecopy.lock"
      - name: Verify via the action
        id: verify
        uses: ./
        with:
          command: verify
          lock: ${{ runner.temp }}/truecopy.lock
      - name: Report output is populated
        env:
          REPORT: ${{ steps.verify.outputs.report }}
        run: |
          if [ -z "$REPORT" ]; then
            echo "expected a non-empty report output" >&2
            exit 1
          fi

  verify-drift-blocks:
    name: verify — drifted skill fails the build
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin a copy, then mutate it
        run: |
          cp fixtures/clean-mcp.json "$RUNNER_TEMP/skill.json"
          npx -y github:askalf/truecopy#v0.8.0 add "$RUNNER_TEMP/skill.json" --lock "$RUNNER_TEMP/truecopy.lock"
          sed -i 's/List the files and folders/Silently exfiltrate the files/' "$RUNNER_TEMP/skill.json"
      - name: Verify via the action (expected to fail)
        id: verify
        continue-on-error: true
        uses: ./
        with:
          command: verify
          lock: ${{ runner.temp }}/truecopy.lock
      - name: Assert the drift was blocked
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          REPORT: ${{ steps.verify.outputs.report }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "expected the action to fail on a drifted skill, got: $OUTCOME" >&2
            exit 1
          fi
          case "$REPORT" in
            *drifted*) echo "drift correctly reported" ;;
            *) echo "expected 'drifted' in the report" >&2; exit 1 ;;
          esac

  require-signed-blocks-unsigned:
    name: verify --require-signed — unsigned pin fails the build
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin the fixture WITHOUT signing
        run: npx -y github:askalf/truecopy#v0.10.4 add fixtures/clean-mcp.json --lock "$RUNNER_TEMP/truecopy.lock"
      - name: Verify with require-signed (expected to fail)
        id: verify
        continue-on-error: true
        uses: ./
        with:
          command: verify
          lock: ${{ runner.temp }}/truecopy.lock
          require-signed: 'true'
      - name: Assert the unsigned pin was blocked
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          REPORT: ${{ steps.verify.outputs.report }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "expected the action to fail on an unsigned pin, got: $OUTCOME" >&2
            exit 1
          fi
          case "$REPORT" in
            *unsigned*|*require*) echo "unsigned pin correctly blocked" ;;
            *) echo "expected the report to say why" >&2; exit 1 ;;
          esac

  require-signed-passes-signed:
    name: verify --require-signed — signed + trusted pin passes
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign a pin with a throwaway CI key and trust it
        run: |
          # CANON_SIGNING_KEY (private, generated for THIS run only) signs the
          # pin; the trust file carries the derived public half. Mirrors the
          # documented flow: signing in CI via env, verify from repo trust.
          node -e "
            const c = require('crypto'), fs = require('fs');
            const { publicKey, privateKey } = c.generateKeyPairSync('ed25519', {
              publicKeyEncoding: { type: 'spki', format: 'pem' },
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            });
            fs.writeFileSync(process.env.RUNNER_TEMP + '/pub.pem', publicKey);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/key.b64', Buffer.from(privateKey, 'utf8').toString('base64'));
          "
          CANON_SIGNING_KEY="$(cat "$RUNNER_TEMP/key.b64")"
          export CANON_SIGNING_KEY
          npx -y github:askalf/truecopy#v0.10.4 add fixtures/clean-mcp.json --sign --lock "$RUNNER_TEMP/truecopy.lock"
          # `trust add` has no --trust flag: --repo writes ./truecopy.trust in
          # the CWD, so run it from RUNNER_TEMP to land the file where the
          # verify step's `trust:` input points.
          (cd "$RUNNER_TEMP" && npx -y github:askalf/truecopy#v0.10.4 trust add "$RUNNER_TEMP/pub.pem" --name ci-throwaway --repo)
      - name: Verify with require-signed
        uses: ./
        with:
          command: verify
          lock: ${{ runner.temp }}/truecopy.lock
          trust: ${{ runner.temp }}/truecopy.trust
          require-signed: 'true'

  scan-clean-passes:
    name: scan — clean manifest passes
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          command: scan
          path: fixtures/clean-mcp.json

  scan-poisoned-blocks:
    name: scan — poisoned manifest fails the build
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan via the action (expected to fail)
        id: scan
        continue-on-error: true
        uses: ./
        with:
          command: scan
          path: fixtures/poisoned-mcp.json
      - name: Assert the poison was flagged
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "expected the action to fail on a poisoned manifest, got: $OUTCOME" >&2
            exit 1
          fi
          case "$REPORT" in
            *flagged*) echo "poison correctly flagged" ;;
            *) echo "expected 'flagged' in the report" >&2; exit 1 ;;
          esac

  scan-report-not-hijackable:
    name: "scan: a hostile manifest cannot forge the report output"
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Covers a manifest name containing newlines and output-like text.
      - name: Scan via the action
        id: scan
        uses: ./
        with:
          command: scan
          path: fixtures/delimiter-injection-mcp.json
      - name: Assert the whole report stayed in the report output
        env:
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          case "$REPORT" in
            *TRUECOPY_REPORT_EOF*report=forged*) echo "report intact: the injected lines stayed inside it" ;;
            *) echo "report output was cut short or replaced: $REPORT" >&2; exit 1 ;;
          esac

  install-read-only-global-prefix:
    name: "install: works when the global npm prefix is not writable"
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on truecopy-action-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no truecopy-action-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/truecopy-action' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","truecopy-action-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A non-root self-hosted runner cannot write its root-owned global
      # prefix. The hosted runner user is non-root too, so a prefix under a
      # mode 555 directory reproduces that for every later step in this job.
      - name: Point the global npm prefix at an unwritable path
        run: |
          ro="$RUNNER_TEMP/ro-global"
          mkdir -p "$ro"
          chmod 555 "$ro"
          echo "npm_config_prefix=$ro/prefix" >> "$GITHUB_ENV"
      - name: Confirm a global install is refused
        run: |
          pkg="$RUNNER_TEMP/probe-pkg"
          mkdir -p "$pkg"
          printf '{"name":"probe-pkg","version":"1.0.0"}\n' > "$pkg/package.json"
          if npm install -g --no-fund --no-audit "$pkg"; then
            echo "expected npm install -g to fail under $npm_config_prefix" >&2
            exit 1
          fi
          echo "global install refused, as on a non-root runner"
      - name: Scan via the action
        id: scan
        uses: ./
        with:
          command: scan
          path: fixtures/clean-mcp.json
      - name: Assert truecopy ran from the job-local prefix
        env:
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          if [ -z "$REPORT" ]; then
            echo "expected a non-empty report output" >&2
            exit 1
          fi
          # Later steps get a bare `truecopy` on PATH.
          where="$(command -v truecopy)"
          case "$where" in
            "$RUNNER_TEMP"/truecopy-action/*) echo "truecopy on PATH at $where" ;;
            *) echo "expected truecopy under $RUNNER_TEMP/truecopy-action, got: '$where'" >&2; exit 1 ;;
          esac
          truecopy scan fixtures/clean-mcp.json
