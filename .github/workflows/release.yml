# Tags and publishes a release for the newest `## [X.Y.Z] - YYYY-MM-DD` section
# in CHANGELOG.md, then points the major tag (v1, ...) at it. Runs when
# CHANGELOG.md changes on master, or by hand with an optional commit to tag.
# A version whose tag already exists is left alone.
name: release

on:
  push:
    branches: [master]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on master to tag (default: the commit this run is on)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push tags, create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit and version
        id: plan
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          target="${INPUT_SHA:-$GITHUB_SHA}"
          target="$(git rev-parse --verify "${target}^{commit}")"
          if ! git merge-base --is-ancestor "$target" origin/master; then
            echo "::error::$target is not on master"
            exit 1
          fi
          version="$(git show "$target:CHANGELOG.md" \
            | sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$/\1/p' | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::no '## [X.Y.Z] - YYYY-MM-DD' section in CHANGELOG.md at $target"
            exit 1
          fi
          tag="v${version}"
          {
            echo "target=$target"
            echo "version=$version"
            echo "tag=$tag"
            echo "major=v${version%%.*}"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists at $(git rev-parse "$tag^{commit}"); nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag at $target"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.plan.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git show "$TARGET:CHANGELOG.md" | awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::the [$VERSION] section of CHANGELOG.md is empty"
            exit 1
          fi

      - name: Tag the release and move the major tag
        if: steps.plan.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.plan.outputs.target }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAJOR: ${{ steps.plan.outputs.major }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag "$TAG" "$TARGET"
          git push "$remote" "refs/tags/$TAG"
          # The major tag follows the highest release in its series, so tagging
          # an older patch never moves it backwards.
          newest="$(git tag -l "${MAJOR}.*" | sort -V | tail -n1)"
          if [ "$newest" = "$TAG" ]; then
            git tag -f "$MAJOR" "$TARGET"
            git push --force "$remote" "refs/tags/$MAJOR"
            echo "$MAJOR -> $TAG ($TARGET)"
          else
            echo "$MAJOR stays on $newest"
          fi

      - name: Publish the GitHub release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
