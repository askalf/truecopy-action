name: Bug report
description: truecopy-action did something other than what it says it does.
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what it did.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest thing that shows it. A saved page, a URL, or a local HTML fixture is ideal — attach it if you can share it.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: truecopy-action version
      placeholder: 'x.y.z'
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Runner OS
      placeholder: 'ubuntu-24.04'
    validations:
      required: true
